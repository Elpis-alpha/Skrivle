<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skrivle — coming soon</title>
  <meta name="description" content="Skrivle is a live collaborative whiteboard you can share in one link — no account, just a URL. Coming soon.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Skrivle — coming soon">
  <meta property="og:description" content="A live collaborative whiteboard you can share in one link. No account, just a URL.">

  <meta name="theme-color" content="#FAF9F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A1620" media="(prefers-color-scheme: dark)">

  <!-- pen-loop mark; ink flips with the OS theme so it stays visible on light/dark tab bars -->
  <link rel="icon" media="(prefers-color-scheme: dark)" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cg%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'%20stroke-width='3.25'%20transform='translate%281%202.5%29'%3E%3Cpath%20stroke='%23F2EEF6'%20d='M16%206c6-.5%2010%204%209.5%2010S20%2026%2014%2025.5%204.5%2019.5%205.5%2013.5%2010%205.5%2014.5%206'/%3E%3Cpath%20stroke='%23A57FC7'%20d='M14.5%206C12%205.5%209.7%203.6%208.2%201'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cg%20fill='none'%20stroke-linecap='round'%20stroke-linejoin='round'%20stroke-width='3.25'%20transform='translate%281%202.5%29'%3E%3Cpath%20stroke='%23241631'%20d='M16%206c6-.5%2010%204%209.5%2010S20%2026%2014%2025.5%204.5%2019.5%205.5%2013.5%2010%205.5%2014.5%206'/%3E%3Cpath%20stroke='%2332174D'%20d='M14.5%206C12%205.5%209.7%203.6%208.2%201'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">

  <style>
    /* Skrivle design tokens — STYLE_GUIDE.md §11.1 (light). Full block inlined
       for fidelity; this page uses only a handful. */
    :root {
      color-scheme: light;

      --canvas-bg: #FAF9F7;
      --surface: #FFFFFF;
      --surface-raised: #FFFFFF;
      --wg-50: #F5F3F0;
      --wg-100: #EDEAE4;
      --wg-200: #DEDAD2;
      --wg-300: #C6C0B4;
      --wg-400: #A8A093;
      --wg-500: #857D6E;
      --wg-600: #5F584C;
      --border: var(--wg-200);
      --border-strong: var(--wg-300);

      --ink: #241631;
      --ink-secondary: #4A3D57;
      --ink-muted: #6F6579;

      --accent-50: #F4EEF9;
      --accent-100: #E7DBF1;
      --accent-200: #CBB3E0;
      --accent-300: #A57FC7;
      --accent-400: #7A4DA6;
      --accent-500: #5C2E86;
      --accent-600: #432066;
      --accent-700: #32174D;
      --accent-800: #25113A;

      --accent: var(--accent-700);
      --accent-hover: var(--accent-600);
      --accent-active: var(--accent-800);
      --accent-subtle: var(--accent-50);
      --accent-on: #FFFFFF;

      --elev-2: 0 4px 12px rgba(36, 22, 49, .10);

      --radius-md: 10px;

      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;

      --dur-fast: 120ms;
      --ease-standard: cubic-bezier(.2, 0, 0, 1);

      --focus-ring: 0 0 0 2px var(--canvas-bg), 0 0 0 4px var(--accent);

      --font-sans: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Dark theme — STYLE_GUIDE.md §11.1, no-JS fallback form (this page has no
       theme script, so it follows the OS setting only). */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;

        --canvas-bg: #1A1620;
        --surface: #241F2C;
        --surface-raised: #2E2838;
        --wg-50: #262130;
        --wg-100: #302A3A;
        --wg-200: #3A3343;
        --wg-300: #48404F;
        --wg-400: #6B6276;
        --wg-500: #8E8399;
        --wg-600: #A99FB4;

        --ink: #F2EEF6;
        --ink-secondary: #C4BBD0;
        --ink-muted: #968BA3;

        --accent: var(--accent-300);
        --accent-hover: var(--accent-200);
        --accent-active: var(--accent-100);
        --accent-subtle: rgba(165, 127, 199, .16);
        --accent-on: #1A1620;

        --elev-2: 0 4px 14px rgba(0, 0, 0, .45);

        --focus-ring: 0 0 0 2px var(--canvas-bg), 0 0 0 4px var(--accent-300);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: var(--space-12) var(--space-6);
      background: var(--canvas-bg);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 560px;
      margin-inline: auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 var(--space-12);
    }

    .logo-mark {
      flex: none;
      width: 30px;
      height: 30px;
      color: var(--ink); /* the loop stroke inherits this via currentColor */
    }

    .logo-mark .tail {
      /* stroke: var(--accent); */
      stroke: currentColor; /* the tail stroke inherits this via currentColor */
    }

    .wordmark {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    h1 {
      margin: 0;
      /* text-4xl (49/52) → text-3xl (39/44) on narrow viewports */
      font-size: clamp(2.4375rem, 1.9rem + 2.4vw, 3.0625rem);
      line-height: 1.08;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-wrap: balance;
    }

    .tagline {
      margin: var(--space-4) 0 0;
      max-width: 68ch;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 400;
      color: var(--ink-secondary);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      margin-top: var(--space-8);
      min-height: 40px;
      padding: 0 var(--space-4);
      border-radius: var(--radius-md);
      background: var(--accent);
      color: var(--accent-on);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color var(--dur-fast) var(--ease-standard);
    }

    .cta:hover {
      background: var(--accent-hover);
    }

    .cta:active {
      background: var(--accent-active);
    }

    .cta:focus-visible {
      outline: none;
      /* §9 double ring; inner ring becomes a light gap over the accent fill */
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .9), 0 0 0 4px var(--accent);
    }

    @media (prefers-reduced-motion: reduce) {
      .cta {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="logo">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.75" transform="translate(1 2.5)">
          <path stroke="currentColor" d="M16 6c6-.5 10 4 9.5 10S20 26 14 25.5 4.5 19.5 5.5 13.5 10 5.5 14.5 6"/>
          <path class="tail" d="M14.5 6C12 5.5 9.7 3.6 8.2 1"/>
        </g>
      </svg>
      <span class="wordmark">skrivle</span>
    </p>
    <h1>A whiteboard you can share in one link.</h1>
    <p class="tagline">Coming soon. A real-time collaborative canvas — no account, just a URL.</p>
    <a class="cta" href="https://github.com/Elpis-alpha/Skrivle">View the repo</a>
  </main>
</body>
</html>
