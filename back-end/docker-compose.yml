# The back-end and Redis are containerised. Postgres is NOT:
#   dev  — a local install on the host; point DATABASE_URL at host.docker.internal
#   prod — a managed database; set DATABASE_URL in the environment
# Redis has no external dependency, so it is bundled here.
services:
  back-end:
    build: .
    # Published on the Docker bridge gateway, not 0.0.0.0 — the host's Nginx
    # reverse-proxies to it and nothing off-box should reach the Node port.
    ports:
      - "172.17.0.1:5002:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    # A board's live canvas is an in-memory Y.Doc; on SIGTERM the snapshot
    # writer flushes every dirty board to Postgres before exiting. The 10s
    # default can cut that short and lose real user work.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold start now also connects to the remote DB and runs `migrate deploy`
      # (docker-entrypoint.sh) before the server listens. start_period failures
      # don't count against retries — this just avoids an unhealthy flap.
      start_period: 30s
    restart: unless-stopped

  # One-off Prisma migration runner. Not started by `docker compose up`
  # (profile-gated); reuses the back-end image and .env. Works even while the
  # back-end container is crash-looping on a failed migration.
  #   docker compose --profile migrate run --rm migrate          # status
  #   docker compose --profile migrate run --rm migrate deploy   # apply pending
  migrate:
    build: .
    profiles: ["migrate"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["npx", "--no-install", "prisma", "migrate"]
    command: ["status"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
