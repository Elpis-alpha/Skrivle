# The back-end and Redis are containerised. Postgres is NOT:
#   dev  — a local install on the host; point DATABASE_URL at host.docker.internal
#   prod — a managed database; set DATABASE_URL in the environment
# Redis has no external dependency, so it is bundled here.
services:
  back-end:
    build: .
    # Published on the Docker bridge gateway, not 0.0.0.0 — the host's Nginx
    # reverse-proxies to it and nothing off-box should reach the Node port.
    ports:
      - "172.17.0.1:5002:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    # A board's live canvas is an in-memory Y.Doc; on SIGTERM the snapshot
    # writer flushes every dirty board to Postgres before exiting. The 10s
    # default can cut that short and lose real user work.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
